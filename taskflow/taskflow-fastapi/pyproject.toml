[project]
name = "taskflow-fastapi"
version = "1.0.0"
description = "TaskFlow API: FastAPI + SQLAlchemy 2 (async) + PostgreSQL + Redis"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib==5.1.3",
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "boto3==1.44.3",
    "celery[redis]==5.7.0",
    "fastapi==0.162.7",
    "pwdlib[argon2]==0.3.1",
    "pydantic-settings==2.16.3",
    "pyjwt==2.15.1",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.8",
    "structlog==26.1.0",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "celery-types==0.26.0",
    "fastapi-cli==0.0.34",
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "types-boto3[s3]==1.44.3",
    "websockets==17.4",
]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "N", "PT", "RET"]
ignore = ["S101"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.fastapi]
entrypoint = "app.main:app"
